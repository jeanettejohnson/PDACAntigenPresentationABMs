name: physicell-analysis-260901
channels:
  - conda-forge
  - bioconda

# physicell-analysis-260901: reproducibility-pinned spec.
# Built from the minimal source spec plus a full solve of the same environment.
#
# This env runs three functions, all downstream of the simulation itself:
#   - Conversion: read PhysiCell output with pcdl, write h5ad and HDF5 into derived/.
#   - Visualization: pdacagviz figures for the paper.
#   - Spatial analysis: cells as a marked point pattern -- 2D coordinates in um plus
#     PhysiCell's own neighbour and spring graphs, which are ground-truth adjacency
#     rather than adjacency inferred from coordinates.
#
# It is separate from physicell-sim-260606, which runs the model. That env's pyqt /
# qt-main / openssl / icu stack no longer re-solves against current conda-forge, so
# any addition there fails; keeping analysis out means its pinned figure stack is
# never re-solved, which is what its own rule 3b exists to protect. The figure pins
# here are deliberately identical to that env's, so a figure drawn in either is the
# same figure -- matplotlib 3.11 against 3.10.9 moved 11% of the pixels in a dense
# scatter, with no code change.
#
# Pinning policy (same shape as physicell-sim-260606, with 3c added):
#   1. Every package from the source spec is pinned to its resolved version.
#   2. The numerical substrate is locked: BLAS/LAPACK with the OpenBLAS variant, the
#      OpenMP and threading runtimes, the Fortran runtimes, and the sparse/eigen,
#      geometry and JIT stacks.
#   3. Method engines are locked: numpy/scipy/pandas, scikit-learn, statsmodels with
#      patsy, scanpy/anndata/squidpy, the whole pysal ecosystem including its
#      modelling and optimisation packages, and the umap/pynndescent backends.
#   3b. The figure stack is locked: matplotlib and seaborn, their compiled layout and
#      contour kernels, and the annotation and colour helpers that address their
#      APIs by keyword.
#   3c. The image and text stack is locked: codecs, raster libraries, and the font
#      shaping chain decide pixel output, and this env both writes figures and reads
#      images for spatial work. Under the other env's rule 5 these were "output
#      fidelity, not API shape" and left to float; here fidelity is the result. This
#      is the one place the two policies deliberately differ.
#   4. Versions only, no build hashes. A build glob is kept only where it locks a real
#      variant: *openblas (BLAS impl), openmp* (OpenBLAS threading), *kmp_llvm (OpenMP
#      mutex), nompi* (MPI-free HDF5/ARPACK/netCDF), cpu_generic* (CPU-only torch),
#      omp* (oneDNN threading), gpl_* / agpl_* (licence-variant media builds).
#   5. Pure I/O, notebook, and OS packages are left unpinned so the solver moves.
#      Transitive system libraries not named here follow their parents.

dependencies:

  # === Interpreter & Jupyter ======================================================
  - python=3.12.14
  - pip
  - ipython=9.17.1
  - ipykernel=7.3.0
  - notebook
  - jupyterlab
  - ipywidgets=8.1.9

  # === BLAS / LAPACK (locked to the OpenBLAS variant) =============================
  # nomkl keeps MKL out: an MKL build of the same libblas version changes
  # floating-point results. Note this env resolved the *openmp* OpenBLAS variant,
  # where physicell-sim-260606 has *pthreads*. That is a real difference in parallel
  # reduction order, and it is why numbers from the two environments can differ in
  # the last bits. Acceptable here because this env never runs the model -- but
  # locked so it cannot drift further.
  - nomkl=1.0
  - libblas=3.11.0=*openblas
  - libcblas=3.11.0=*openblas
  - liblapack=3.11.0=*openblas
  - liblapacke=3.11.0=*openblas
  - libopenblas=0.3.34=openmp*

  # === OpenMP / threading runtime =================================================
  # LLVM OpenMP here, not GNU: numba, pytorch and OpenBLAS all resolved against it.
  # Reduction order under OpenMP is FP-sensitive, so the runtime and its mutex
  # variant are locked. tbb, hwloc and threadpoolctl govern thread pools and
  # placement, which also set reduction order. joblib sets worker counts for
  # scikit-learn and squidpy, and the worker count decides combination order.
  - llvm-openmp=23.1.0
  - _openmp_mutex=4.5=*kmp_llvm
  - tbb=2023.0.0
  - tbb-devel=2023.0.0
  - libhwloc=2.13.0
  - threadpoolctl=3.6.0
  - joblib=1.6.0

  # === Fortran runtime ============================================================
  - libgfortran=16.2.0
  - libgfortran5=16.2.0

  # === JIT / compiler backend (numba stack) =======================================
  # umap, scanpy and pointpats JIT through numba; the LLVM backend sets emitted code.
  - numba=0.67.0
  - llvmlite=0.49.0

  # === Sparse / eigen / geometry / transforms =====================================
  # ARPACK backs scipy eigsh and scanpy spectral embedding; eigen backs squidpy and
  # vtk; fftw is in scipy's transform path. Qhull is scipy.spatial's Delaunay,
  # Voronoi and ConvexHull kernel -- squarely in the result path for point-pattern
  # work, where a degenerate case broken differently changes the triangulation.
  - arpack=3.9.1=nompi*
  - eigen=5.0.1
  - fftw=3.3.11=nompi*
  - qhull=2020.2
  - glpk=5.0

  # === Core array & numerics ======================================================
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=2.3.3
  # Dispatch layers that decide which backend implementation scipy, scikit-learn and
  # scanpy actually call. physicell-sim-260606 pins both for the same reason.
  - array-api-compat=1.15.0
  - fast-array-utils=1.5

  # === Symbolic / arbitrary precision =============================================
  # sympy backs parts of torch; gmpy2 gives it GMP/MPFR arithmetic, and MPFR
  # versions can differ in the last bit.
  - sympy=1.14.0
  - gmpy2=2.3.1
  - gmp=6.3.0
  - mpfr=4.2.2
  - mpc=1.4.0

  # === Statistics & modeling ======================================================
  - statsmodels=0.14.6
  - patsy=1.0.3
  - scikit-learn=1.9.0

  # === Conversion (pcdl) ==========================================================
  # pcdl is on bioconda, not conda-forge. 4.1.7 is the newest packaged release; the
  # local checkout at python-loader/ is 4.1.8 and serves as the manual.
  #
  # hdf5 is 1.14.6, not the 2.2.0 this env would otherwise take: pyarrow's solve
  # pulls it down, so it is pinned rather than left to move under a later install.
  # The derived archive was written under 2.2.0 -- confirm it still reads before
  # trusting this env with it.
  #
  # h5repack ships with hdf5 and is called by scripts/extract_simulation_results.py
  # to recompress the series, so the hdf5 pin covers a command-line tool too.
  - pcdl=4.1.7
  - anndata=0.12.16
  - hdf5=1.14.6=nompi*
  - h5py=3.16.0=nompi*
  - hdf4=4.2.15
  - libnetcdf=4.10.0=nompi*
  - netcdf4=1.7.4=nompi*
  - h5netcdf=1.8.1
  - cftime=1.6.5

  # === Derived tables & array storage =============================================
  # Parquet for derived output that is an event list rather than a cell x feature
  # matrix -- scripts/extract_attacks.py writes one row per attacker, target and
  # timepoint. zarr/numcodecs back spatialdata; the codec decides stored bytes and
  # the chunking decides reduction order on read.
  - pyarrow=25.0.0
  - libarrow=25.0.0
  - zarr=3.3.0
  - numcodecs=0.16.5
  - xarray=2026.7.0
  # dask chunk boundaries set the order partial reductions combine in, so the
  # scheduler is part of the result path, not just a performance choice.
  - dask=2026.8.0
  - dask-core=2026.8.0
  - distributed=2026.8.0
  - dask-image=2026.5.0

  # === Single-cell & spatial (scverse) ============================================
  # squidpy reads obsm["spatial"] directly and accepts the obsp contact graphs in
  # place of a neighbour graph it would otherwise infer. It provides Ripley's K/L/F,
  # co-occurrence, neighbourhood enrichment and spatial autocorrelation.
  - scanpy=1.12.4
  - squidpy=1.8.2
  - umap-learn=0.5.12
  - pynndescent=0.5.13
  - networkx=3.6.1
  - annsel=0.1.2
  - scverse-misc=0.1.4
  - legacy-api-wrap=1.5
  - session-info2=0.4.2
  # scanpy orders categories with natsort, and category order decides groupby output
  # order and which colour each group is assigned.
  - natsort=8.4.0
  # Graph clustering backends. scanpy's leiden errors without them, and the failure
  # is at call time rather than import time. libleidenalg is the C++ implementation.
  - igraph=0.10.17
  - python-igraph=0.11.9
  - leidenalg=0.10.2
  - libleidenalg=0.11.1
  - louvain=0.8.2
  # squidpy's ligand-receptor work fetches from OmniPath at run time. Pinning the
  # client does NOT pin the database it downloads, so a result that depends on it is
  # not reproducible from this file alone -- cache the query if it matters.
  - omnipath=1.0.12
  - docrep=0.3.2
  - validators=0.35.0
  - inflect=7.5.0
  - pint=0.25.3

  # === SpatialData ================================================================
  - spatialdata=0.8.0
  - spatialdata-plot=0.4.2
  - multiscale-spatial-image=2.0.3
  - spatial-image=1.2.3
  - ome-zarr=0.18.0
  - ome-zarr-models=1.8.1
  - pydantic-zarr=0.10.0
  - pydantic=2.12.5

  # === Torch (squidpy's neighbourhood models) =====================================
  # CPU-only. The C++ runtime, the CPU kernel library and the vectorised
  # transcendental library are all in the result path: oneDNN picks kernels by CPU
  # feature and sleef supplies exp/log/sin, so both move results in the last bits.
  - pytorch=2.13.0=cpu_generic*
  - libtorch=2.13.0=cpu_generic*
  - onednn=3.12=omp*
  - sleef=3.9.0
  - optree=0.20.0

  # === Spatial statistics (pysal ecosystem) =======================================
  # Kept whole. libpysal supplies the weights objects the rest build on; pointpats is
  # the point-pattern half and the one that matches cells, where esda operates on
  # areal units. The modelling and optimisation packages are estimators -- every one
  # of them is a result path, so all are pinned rather than left to the metapackage.
  - pysal=26.7
  - libpysal=4.15.0
  - pointpats=2.6.0
  - esda=2.10.0
  - spreg=1.9.1
  - spglm=1.1.0
  - spint=1.1.0
  - spvcm=0.3.0
  - spml=0.2.2
  - mgwr=2.2.1
  - giddy=2.3.9
  - inequality=1.1.2
  - segregation=2.5.5
  - momepy=1.0.0
  - tobler=0.14.0
  - access=1.1.10.post3
  - spaghetti=1.7.6
  - splot=1.1.7
  - quantecon=0.11.4
  # Classification schemes (quantiles, Fisher-Jenks, head-tail). The scheme is the
  # result whenever values are binned before plotting or testing.
  - mapclassify=2.11.0
  # spopt is integer programming: the solver and its version decide which optimum is
  # returned when several are equally good, so the LP/MIP stack is pinned with it.
  - spopt=0.7.0
  - pulp=2.8.0
  - coin-or-cbc=2.10.13
  - coin-or-clp=1.17.11
  - coin-or-cgl=0.60.10
  - coin-or-osi=0.108.12
  - coin-or-utils=2.11.13

  # === Geometry & geospatial I/O ==================================================
  # For the tissue regions rather than the cells: duct boundaries and the hex
  # duct-filler layout. geos/proj are the compiled predicates and projections under
  # them, and a predicate change moves a boundary test.
  - geopandas=1.1.4
  - geopandas-base=1.1.4
  - shapely=2.1.2
  - geos=3.14.1
  - proj=9.8.1
  - pyproj=3.7.2
  - fiona=1.10.1
  - pyogrio=0.12.1
  - rasterio=1.5.0
  - rasterstats=0.21.0
  - cartopy=0.25.0
  - folium=0.20.0
  - branca=0.8.2
  - libgdal-core=3.12.4
  - libspatialite=5.1.0
  - librttopo=1.1.0
  - libkml=1.3.0
  - freexl=2.0.0
  - pyshp=3.1.6
  # R-tree spatial indexing. Query results come back in index order, so the index
  # build decides tie-breaking among equidistant neighbours.
  - libspatialindex=2.1.0
  - rtree=1.4.1

  # === Radar / atmospheric (transitive, retained) =================================
  # Pulled in with the pysal and xarray ecosystems rather than requested. Retained so
  # the environment resolves as solved, and pinned so they cannot drag xarray, zarr
  # or netCDF to different versions on a later install. Nothing here uses them.
  - arm_pyart=2.2.5
  - xradar=0.12.0
  - cmweather=0.3.2
  - open-radar-data=0.8.0

  # === Figures (pdacagviz) ========================================================
  # Identical to physicell-sim-260606, deliberately: pdacagviz addresses rcParam keys
  # by name and calls seaborn with arguments renamed in 0.12 and 0.13, so a version
  # difference between the two environments changes figure appearance silently.
  # matplotlib-base rather than matplotlib, since no Qt backend is wanted here.
  #
  # contourpy is the contour algorithm and kiwisolver the constraint solver behind
  # tight_layout: both decide geometry on the page, so they belong with matplotlib
  # rather than under rule 5.
  - matplotlib-base=3.10.9
  - seaborn=0.13.2
  - seaborn-base=0.13.2
  - contourpy=1.3.3
  - kiwisolver=1.5.1
  - cycler=0.12.1
  - pyparsing=3.3.2
  - munkres=1.1.4
  - colorcet=3.2.1
  - statannotations=0.7.2
  - textalloc=1.2.3
  - matplotlib-scalebar=0.9.0
  - pycairo=1.29.1
  - bokeh=3.10.0
  - datashader=0.19.1
  - xarray-spatial=0.10.18

  # === Image & text stack (rule 3c) ===============================================
  # Pinned because they decide pixel output, both for figures written here and for
  # rasters read during spatial work. pillow rasterizes; freetype, harfbuzz and pango
  # shape and position glyphs, so text metrics and therefore layout move with them;
  # fontconfig decides which font file is resolved at all, and the font packages are
  # what it resolves to. The codec libraries decide what a written PNG or TIFF
  # actually contains.
  - pillow=12.3.0
  - freetype=2.14.3
  - libfreetype=2.14.3
  - libfreetype6=2.14.3
  - fonttools=4.63.0
  - unicodedata2=17.0.1
  - harfbuzz=14.4.0
  - libharfbuzz=14.4.0
  - pango=1.58.2
  - fontconfig=2.18.3
  - fonts-conda-ecosystem=1
  - fonts-conda-forge=1
  - font-ttf-dejavu-sans-mono=2.37
  - font-ttf-inconsolata=3.000
  - font-ttf-source-code-pro=2.038
  - font-ttf-ubuntu=0.83
  - cairo=1.18.4
  - scikit-image=0.26.0
  - imageio=2.37.0
  - tifffile=2026.3.3
  - imagecodecs=2025.11.11
  - pims=0.7
  - libpng=1.6.58
  - libtiff=4.7.2
  - libjpeg-turbo=3.2.0
  - libwebp-base=1.6.0
  - openjpeg=2.5.4
  - openjph=0.31.0
  - lcms2=2.19.1
  - lerc=4.2.0
  - libdeflate=1.25
  - charls=2.4.4
  - libavif16=1.4.2
  - libheif=1.23.3=gpl_*
  - libde265=1.1.1
  - libjxl=0.11.2
  - libhwy=1.4.0
  - jxrlib=1.1
  - brunsli=0.1
  - libzopfli=1.0.3
  - zlib-ng=2.3.3
  - giflib=5.2.2
  - jasper=4.2.9
  - libraw=0.22.2
  - openexr=3.4.15
  - imath=3.2.2
  # Array compressors in the imagecodecs / zarr / blosc path.
  - blosc=1.21.6
  - c-blosc2=2.22.0
  - libaec=1.1.5
  - zfp=1.0.1
  - lz4=4.4.5
  - snappy=1.2.2

  # === Rendering & media ==========================================================
  # vtk arrives with pcdl's optional extras and backs spatialdata rendering; ffmpeg
  # and imagemagick write movies and convert frames. Licence variants are locked
  # because a non-gpl build of ffmpeg lacks encoders the movie scripts assume.
  - vtk=9.6.2
  - vtk-base=9.6.2
  - vtk-io-ffmpeg=9.6.2
  - ffmpeg=8.1.2=gpl_*
  - imagemagick=7.1.2_26=agpl_*
  - ghostscript=10.07.1
  - graphviz=14.1.2
  - qt6-main=6.11.2

  # === Development ================================================================
  # pdacagviz's test suite imports pytest at module scope, so without it the suite
  # cannot run here at all. packaging backs pdacagviz's version guards and is in the
  # result path for which compatibility branch is taken.
  - pytest=9.1.1
  - packaging=26.3
